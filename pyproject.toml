[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-clone"
version = "0.1.0"
description = "Professional database cloning tool for PostgreSQL and MySQL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Erley", email = "erley@example.com" },
]
keywords = ["database", "clone", "migration", "postgresql", "mysql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "testcontainers[postgres,mysql]>=3.7",
]

[project.urls]
Homepage = "https://github.com/erley/db-clone"
Repository = "https://github.com/erley/db-clone"
Issues = "https://github.com/erley/db-clone/issues"

[project.scripts]
db-clone = "db_clone.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/db_clone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
